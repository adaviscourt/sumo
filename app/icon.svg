<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rice background -->
  <rect width="32" height="32" rx="6" fill="#f8f1de"/>
  <!-- Clay surface -->
  <circle cx="16" cy="16" r="13" fill="#b55233" fill-opacity="0.10"/>
  <!-- Outer boundary (faint) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#27386e" stroke-width="1" opacity="0.35"/>
  <!-- Inner dohyō ring (tawara line) -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#27386e" stroke-width="2.5"/>
</svg>
