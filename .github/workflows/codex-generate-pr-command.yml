name: Codex Generate PR Command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  codex-generate-pr:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '/codex-generate-pr')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post @codex delegation comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = '.github/codex-comment-template.md';

            let template = '@codex\nPlease implement this issue and open a PR.';
            if (fs.existsSync(path)) {
              template = fs.readFileSync(path, 'utf8').trim();
            }

            const issue = context.payload.issue;
            const issueUrl = issue.html_url;
            const issueTitle = issue.title;
            const issueNumber = issue.number;

            const body = [
              template,
              '',
              `Context:`,
              `- Issue: ${issueTitle}`,
              `- URL: ${issueUrl}`,
              `- Required PR linkage line: \\`Closes #${issueNumber}\\``,
              '- Environment check first: run `bash scripts/codex/maintenance-github.sh` and include output if it fails.',
              '- If PR API/tool creation fails (e.g., 404), use fallback URL: `https://github.com/adaviscourt/sumo/pull/new/<branch>` and report that URL.',
              '',
              '_Triggered by `/codex-generate-pr` command._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
